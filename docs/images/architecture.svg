<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
<title id="title">Break My Agent architecture</title><desc id="desc">A participant question and untrusted FAQ retrieval feed an OpenRouter model. A tool proposal passes runtime validation and application policy before creating a ledger receipt. A trace records the observable steps; replay uses captured arguments without calling the model.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9588c3"/></marker></defs>
<rect width="1120" height="530" rx="24" fill="#191a2d"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="53" fill="#eee9ff" font-size="25" font-weight="700">Evidence informs. Application code authorizes.</text><text x="44" y="83" fill="#bfb4d5" font-size="15">A bounded agent loop with observable effects</text>
<g fill="none" stroke="#9588c3" stroke-width="2" marker-end="url(#arrow)"><path d="M264 164H332"/><path d="M264 274H295V184H332"/><path d="M542 174H610"/><path d="M820 174H888"/><path d="M996 219V345H820"/><path d="M438 219V345H610"/><path d="M716 390V438H996V219" stroke-dasharray="6 5"/></g>
<g stroke="#61527e" fill="#29263f"><rect x="44" y="119" width="220" height="90" rx="12"/><rect x="44" y="229" width="220" height="90" rx="12"/><rect x="332" y="129" width="210" height="90" rx="12"/><rect x="610" y="129" width="210" height="90" rx="12"/><rect x="888" y="129" width="190" height="90" rx="12"/><rect x="610" y="300" width="210" height="90" rx="12"/></g>
<g fill="#eee9ff" font-size="18" font-weight="600" text-anchor="middle"><text x="154" y="157">Participant question</text><text x="154" y="267">FAQ retrieval</text><text x="437" y="166">OpenRouter model</text><text x="715" y="166">Application boundary</text><text x="983" y="166">Ledger + receipt</text><text x="715" y="337">Observable trace</text></g>
<g fill="#bfb4d5" font-size="13" text-anchor="middle"><text x="154" y="183">Bounded conversation history</text><text x="154" y="293">Versioned, editable, untrusted</text><text x="437" y="191">Text or one tool proposal</text><text x="715" y="191">Schema + policy checks</text><text x="983" y="191">Verified action outcome</text><text x="715" y="363">Evidence, calls, results, usage</text><text x="855" y="464">Replay: captured arguments, no inference</text></g>
<text x="44" y="390" fill="#bba5ff" font-size="15">GUARDED: ownership, cancellation, exact fee, duplicate</text><text x="44" y="419" fill="#bfb4d5" font-size="14">UNSAFE: ownership and exact-fee checks deliberately omitted</text><text x="44" y="487" fill="#8f83a6" font-size="13">Synthetic credits · separate ledgers · one local in-memory session</text></g></svg>